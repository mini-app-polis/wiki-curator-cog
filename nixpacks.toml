[phases.setup]
# git is needed at runtime to clone wcs-wiki on boot. The "..." spread
# preserves Nixpacks' auto-detected Python packages — without it, the
# install phase fails with `python: command not found` (exit 127)
# because we'd be replacing the default setup pkg list, not extending it.
nixPkgs = ["...", "git"]

[phases.install]
# Pin uv to a version that understands the `revision = 3` uv.lock format
# semantic-release regenerates on every release. Nixpacks v1.41's hardcoded
# default (uv 0.4.30) is too old and bails on that revision.
#
# We hardcode the version here rather than going through the supported
# NIXPACKS_UV_VERSION variable because Railway materializes every nixpacks
# `[variables]` key as a build ARG on the generated Dockerfile, and if the
# service has the same env-var name defined but empty (or unset), Railway
# passes `--build-arg NIXPACKS_UV_VERSION=`, which overrides the toml
# default with an empty string and yields `pip install uv==` (exit 1, "No
# matching distribution"). Hardcoding the version in the install command
# sidesteps that machinery entirely so the build works on any service
# regardless of dashboard env-var state.
#
# UV_PROJECT_ENVIRONMENT=/opt/venv is set inline because `uv sync` does
# NOT honor an activated venv (VIRTUAL_ENV); it installs into the path
# pointed to by UV_PROJECT_ENVIRONMENT, defaulting to `.venv/` in the
# project root. Without this, deps land in `.venv/` while the container's
# CMD `python -m wiki_curator_cog.main` runs from /opt/venv/bin/python
# and fails with `ModuleNotFoundError: No module named 'wiki_curator_cog'`.
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install uv==0.7.0 && UV_PROJECT_ENVIRONMENT=/opt/venv uv sync --no-dev --frozen",
]
cacheDirectories = ["/root/.cache/uv"]
