[project]
name = "wiki-curator-cog"
dynamic = ["version"]
description = "Renders the wcs-wiki markdown knowledge base from the canonical WCS corpus in api-kaianolevine-com. One run per wake; no resident process."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "miniapppolis-common-utils[llm]>=6.4.0,<7",
    "anthropic>=0.40",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "sentry-sdk>=2.0.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "gitpython>=3.1,<4.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/wiki_curator_cog/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_curator_cog"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["wiki_curator_cog"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]
addopts = "--cov=wiki_curator_cog --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.coverage.report]
# TEST-019: CI fails below this floor. Raise it as coverage rises; lowering it is a reviewed edit.
fail_under = 75

[tool.uv]
# The uv every lock in the fleet is written with. setup-uv reads this in CI,
# and an older or newer local uv refuses to run instead of rewriting the
# lock's revision. Upgrading uv is a fleet sweep: bump this everywhere, then
# re-lock, in commits of their own.
required-version = "==0.13.0"
