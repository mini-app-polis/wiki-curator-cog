[project]
name = "wiki-curator-cog"
dynamic = ["version"]
description = "Renders the wcs-wiki markdown knowledge base from the canonical WCS corpus in api-kaianolevine-com. One run per wake; no resident process."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "miniapppolis-common-utils>=5.11.0,<6",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "sentry-sdk>=2.0.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "gitpython>=3.1,<4.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/wiki_curator_cog/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_curator_cog"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["wiki_curator_cog"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=wiki_curator_cog --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
