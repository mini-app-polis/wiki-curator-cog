name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Delegates to the fleet's shared security workflow: gitleaks over full
  # history, the dependency audit against the resolved set, and semgrep.
  security:
    uses: mini-app-polis/.github/.github/workflows/security.yml@v3
    with:
      language: python
      package-manager: uv

  # Lock check, lint, format, coverage and typecheck, from the shared
  # workflow so every cog's `test` stage is the same stage (CD-026). It is
  # the union of what the cogs ran inline, so adopting it loses nothing —
  # the CD-020 lock check this job used to spell out is in there.
  test:
    uses: mini-app-polis/.github/.github/workflows/python-test.yml@v3
    with:
      # TEST-006: coverage measured on every run, reported in the terminal.
      pytest-args: "--cov=wiki_curator_cog --cov-report=term-missing"
      # TEST-012: every Python repo typechecks in CI, against its [tool.mypy].
      typecheck: "uv run mypy src/"
      # No terraform-dir: the worker's infra is module "wiki_curator" in
      # mini-app-polis/infra, as for the other Lambda cogs.

  release:
    name: Release
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.released.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # uv + Python are required by the @semantic-release/exec step,
      # which runs `uv version X.Y.Z && uv lock` so the lockfile's
      # record of THIS package's own version stays in sync with the
      # released version. Mirrors evaluator-cog setup.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --all-extras

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install semantic-release plugins
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/commit-analyzer \
            @semantic-release/exec \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/release-notes-generator

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # semantic-release tags the release commit it leaves at HEAD. No tag
      # there means this run released nothing — but a re-run of a release
      # that failed after pushing its tag (attempt 1 of 2.3.0) releases
      # nothing either, while the tag it should deploy sits on main's tip,
      # one commit past the merge this run checked out. So: the tag at HEAD,
      # else the tag on main's tip when that tip is a release commit whose
      # parent is this run's commit. Anything else deploys nothing.
      - name: Record the release tag
        id: released
        run: |
          tag="$(git tag --points-at HEAD --list 'v*' | head -n1)"
          if [ -z "$tag" ]; then
            git fetch --quiet --tags origin main
            tip="$(git rev-parse FETCH_HEAD)"
            if [ "$(git rev-parse "$tip^")" = "$GITHUB_SHA" ]; then
              tag="$(git tag --points-at "$tip" --list 'v*' | head -n1)"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # The wiki-jobs worker (ADR-006), deployed here as a job: a release
  # published with GITHUB_TOKEN starts no workflows, so `on: release` would
  # never fire and the Lambda would drift behind main.
  deploy:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      id-token: write
      contents: read
    uses: mini-app-polis/.github/.github/workflows/lambda-deploy.yml@v3
    with:
      ref: ${{ needs.release.outputs.tag }}
      # These three match this cog's block in mini-app-polis/infra cogs.tf; the
      # deploy refuses a function whose architecture differs.
      handler: wiki_curator_cog.worker.lambda_handler
      architecture: arm64
      python-version: "3.11"
      role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      region: ${{ vars.AWS_REGION }}
      function-name: ${{ vars.AWS_FUNCTION_NAME }}

  # A release can change how pages are built (pages.py and what it builds on)
  # without changing any of the curator's state, so no job would rebuild
  # them and the site would keep the old pages until someone clicked
  # "Rebuild every page" in /admin/wiki. This asks for that rebuild once the
  # new code is live: the same free operation, through the API,
  # which stays the only producer onto the queue (CD-006). No model calls.
  #
  # The key is the repository secret WIKI_CURATOR_DEPLOY_API_KEY, the
  # wiki-curator-deploy machine in api-kaianolevine-com's identity registry,
  # whose role holds wcs.wiki.operate and nothing else. A failure here fails
  # the run, so a stale site is seen, not found later.
  rebuild:
    needs: deploy
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Rebuild every page
        env:
          API_KEY: ${{ secrets.WIKI_CURATOR_DEPLOY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${API_KEY}" ]; then
            echo "FATAL: the repository secret WIKI_CURATOR_DEPLOY_API_KEY is not set." >&2
            exit 1
          fi
          # A named User-Agent: the API sits behind Cloudflare, which rejects
          # unidentified automation (see the shared evaluate.yml).
          http_status=$(curl -sS \
            --retry 5 --retry-connrefused --retry-delay 5 \
            --max-time 30 \
            -A "mini-app-polis-wiki-curator-deploy/1 (+https://github.com/mini-app-polis/wiki-curator-cog)" \
            -H "Authorization: Bearer ${API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -o response.json \
            -w "%{http_code}" \
            -X POST "https://api.kaianolevine.com/v1/wcs/wiki/admin/jobs" \
            -d '{"action": "rebuild_every_page"}') || {
              echo "FATAL: could not reach the API." >&2
              exit 1
            }
          jq . response.json || cat response.json
          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo "FATAL: the rebuild was not queued (${http_status})." >&2
            exit 1
          fi

  # Conformance is graded when the repository changes, and this is where
  # that is said. The evaluation runs after this job ends, so what the job
  # reports is whether the request landed — never what was found.
  #
  # This repo is `status: development` in the registry, so the fleet sweep
  # skips it. That makes this job the only evaluation it gets — the invoke
  # path reads no registry and does not care about status.
  evaluate:
    needs: release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: mini-app-polis/.github/.github/workflows/evaluate.yml@v3
    secrets:
      api-key: ${{ secrets.CI_VALIDATOR_API_KEY }}
