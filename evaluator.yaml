# wiki-curator-cog / evaluator.yaml
# Per-repo evaluation configuration — ecosystem-standards ADR-001, ADR-002

type: pipeline-cog

# ADR-009 defines `pipeline-cog` as a queue-driven Lambda worker declared in
# the repo's infra/. This cog is a one-shot Railway process with no queue and
# no infra/ — see docs/decisions/ADR-004-one-shot-on-railway-no-prefect.md for
# why, and for the Lambda fit check that failed before any of it was decided.
#
# These are DEFERRALS, not exemptions, and the distinction is the point. An
# exemption claims a rule should not apply to this repo. That claim cannot be
# made yet: ADR-002's own test — the same exemption carried for the same
# structural reason — says the taxonomy is what has fallen behind, and the
# Layer 2 polish pass will be the second thing of this shape. Until that
# decision is taken these say "not satisfied, and known", which is what a
# deferral is for.

deferrals:
  - rule: PIPE-016
    reason: >
      Requires infra/ declaring a queue, a function and an event source
      mapping. This cog has none of the three. A run takes no arguments —
      the export is a full idempotent re-render of the whole corpus — so
      every queue message would be identical and a consumer would collapse
      them into one run. Prefect is gone, which is the half of PIPE-016 that
      is satisfied. Blocked on the taxonomy decision in ADR-004.
    until: null

  - rule: PIPE-017
    reason: >
      Per-record failure reporting, a dead-letter queue and a visibility
      timeout longer than the function timeout. There are no records: one
      wake is one run of one mode. What the rule is protecting — a failure
      that nobody hears about — is covered instead by run_report (one run,
      one report, sent on the way out of a failure) and by the Healthchecks
      grace period. Blocked on the taxonomy decision in ADR-004.
    until: null

  - rule: PIPE-018
    reason: >
      A concurrency ceiling declared in infra/. There is no infra/ and no
      reservation to declare. Serialisation comes from the shape instead:
      one wake is one process with its own clone, and Railway will not start
      the service again while a previous start is Active. Two overlapping
      runs could still race on the push, where git rejects the loser
      non-fast-forward. Blocked on the taxonomy decision in ADR-004.
    until: null

  - rule: PIPE-020
    reason: >
      The check looks for get_remaining_time_in_millis in production source.
      There is no Lambda context to read it from. The rule's concern — a run
      killed by its ceiling with no report — is met by
      src/wiki_curator_cog/_deadline.py, which raises inside the run a margin
      before a declared budget (RUN_TIMEOUT_SECONDS) so the report is sent
      and main exits non-zero. That budget matters more here than on Lambda:
      Railway silently skips every later start while one is still Active.
      Wants a non-Lambda branch in the rule.
    until: null

  - rule: CD-010
    reason: >
      ADR-009 makes a pipeline cog's liveness layer a dead-letter-queue alarm
      with an action. There is no queue. Liveness is Healthchecks.io instead,
      pinged /start and then success or /fail per run, so the check's grace
      period catches a run that never came back — which is the failure a
      process cannot report on its own behalf. Sentry covers the unhandled
      exception. Blocked on the taxonomy decision in ADR-004.
    until: null

  - rule: CD-024
    reason: >
      Reads a pipeline cog's infra/ Terraform — memory_size and timeout — as
      its platform descriptor. There is no infra/. The equivalent declarations
      live in railway.json (startCommand, restartPolicyType: NEVER) and in
      RUN_TIMEOUT_SECONDS. Blocked on the taxonomy decision in ADR-004.
    until: null

exemptions: []
