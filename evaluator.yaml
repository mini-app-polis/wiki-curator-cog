# wiki-curator-cog / evaluator.yaml
# Per-repo evaluation configuration — ecosystem-standards ADR-001, ADR-002

type: pipeline-cog

# A queue-driven Lambda worker, like the other pipeline cogs (ADR-006 here):
# wiki-curator-jobs.fifo and its dead-letter queue, the function, the event
# source mapping, reserved concurrency and the alarms are `module
# "wiki_curator"` in mini-app-polis/infra. The Railway one-shot process that
# needed the runtime exemptions this file used to hold was retired with its
# service (MINI-95); they went with it.

exemptions:
  - rule: PY-013
    reason: >
      Taken from the rule's own exemption path: a cog whose inputs cannot
      contain duplicates by construction declares that here with a reason
      naming why.

      A job names a unit of work — a source, or entity slugs — not a file.
      Every pass is watermarked in the API (statements linked, entities
      decided, statements integrated, under a prompt version), so a job seen
      twice finds nothing left to do and makes no model call; materialise
      rewrites the same page document. Duplicate suppression of the inputs
      themselves — one source row per extraction — is upstream in
      api-kaianolevine-com, enforced by a unique index (PIPE-002,
      migration 030), not here.
  - rule: CD-026
    reason: >
      ci.yml has one job outside the canonical set: `rebuild`, after
      `deploy` (MINI-109). A release can change how pages are built without
      changing any of the curator's state, so it asks the API for one
      rebuild of every page once the new code is live. That request can't
      go in `deploy`, which calls the shared lambda-deploy.yml and takes no
      extra steps. It isn't `test`, because it runs after the release, on
      main only, against production. It holds its own key
      (WIKI_CURATOR_DEPLOY_API_KEY, the wiki-curator-deploy machine), which
      no other stage should hold.
